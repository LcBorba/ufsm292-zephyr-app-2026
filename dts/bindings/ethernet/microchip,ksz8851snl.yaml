# SPDX-License-Identifier: Apache-2.0

description: Microchip KSZ8851SNL 10/100 Ethernet controller with SPI interface

compatible: "microchip,ksz8851snl"

include: [spi-device.yaml, ethernet-controller.yaml]

properties:
  int-gpios:
    type: phandle-array
    required: false
    description: Active-low, open-drain interrupt output.

  reset-gpios:
    type: phandle-array
    required: false
    description: Active-low hardware reset input.
