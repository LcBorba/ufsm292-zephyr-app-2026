# Radio TX testbed for the SAM R21 Xplained Pro (samr21_xpro only).
# Raw 802.15.4 mode per lib/radio/TX-PLAN.md §4.5: no IP stack, the app calls
# the rf2xx radio API directly. Must match the RX side channel (default 15).

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
# RAW_MODE defaults IEEE802154_L2_PKT_INCL_FCS to y, which makes the rf2xx
# driver hand us the 2-byte FCS as part of the PSDU (ieee802154_rf2xx.c only
# strips it when this is n). sensor_frame_decode() requires the FCS to be
# already removed (18-byte payload, not 20), so turn it off explicitly.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n
# net_recv_data() runs on the driver's RX thread and does decode + hexdump +
# log packaging there (~750 B of the deepest path measured with -fstack-usage);
# the driver default of 800 B is not enough headroom.
CONFIG_IEEE802154_RF2XX_RX_STACK_SIZE=2048
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_RADIO=y
CONFIG_GPIO=y
CONFIG_LOG=y
# rf2xx CSMA backoff needs rand; no TRNG driver on this board, use test RNG
CONFIG_TEST_RANDOM_GENERATOR=y

# The TX image never consumes the per-frame receive ring; save the SRAM.
CONFIG_RADIO_TESTBED_RING=n
