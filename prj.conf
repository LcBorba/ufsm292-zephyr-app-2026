# Configurações de Sistema & Logs
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# Habilita o subsistema de drivers de rede
CONFIG_NET_DRIVERS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_ENC28J60=y

# Subsistema de Gerador Aleatório
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Pilha de Rede (Networking)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=n

# Redução de Buffers para Economia de RAM (SAMD21)
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONN=2
CONFIG_NET_MAX_CONTEXTS=2

# Configuração de IP/Sockets/DHCP
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y

# Cliente HTTP
CONFIG_HTTP_CLIENT=y
