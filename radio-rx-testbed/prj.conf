# Radio RX testbed for the SAM R21 Xplained Pro (samr21_xpro only).
# Raw 802.15.4 mode: the rf2xx driver hands received frames to the app via
# net_recv_data() (the net stack compiles to net_pkt.c only in raw mode).
# Promiscuous mode is enabled so any on-channel frame is accepted; the
# production gateway will use a PAN filter instead (lib/radio/RX-PLAN.md §4).

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
# RAW_MODE defaults IEEE802154_L2_PKT_INCL_FCS to y, which makes the rf2xx
# driver hand us the 2-byte FCS as part of the PSDU (ieee802154_rf2xx.c only
# strips it when this is n). sensor_frame_decode() requires the FCS to be
# already removed (18-byte payload, not 20), so turn it off explicitly.
# Without this every frame lands in `malformed` and LED0 never blinks.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n
# net_recv_data() runs on the driver's RX thread and does decode + hexdump +
# log packaging there (~750 B of the deepest path measured with -fstack-usage);
# the driver default of 800 B is not enough headroom.
CONFIG_IEEE802154_RF2XX_RX_STACK_SIZE=2048
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_RADIO=y
CONFIG_GPIO=y
CONFIG_LOG=y
# rf2xx CSMA backoff needs rand; no TRNG driver on this board, use test RNG
CONFIG_TEST_RANDOM_GENERATOR=y

# Console line input for the `dump`/`reset`/`stats` commands the host monitor
# uses to pull the on-target per-frame ring buffer in bulk.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
